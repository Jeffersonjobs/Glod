# Publica la landing + panel (modo demo) en GitHub Pages.
# El login y los datos en vivo requieren node server.js + el bot (no existen en Pages).
name: Deploy Glod a GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'glod-dashboard/public/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: glod-dashboard/public
      - id: deployment
        uses: actions/deploy-pages@v4
